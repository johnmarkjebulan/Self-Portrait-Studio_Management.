name: Verify Pose and Pics
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-disposable-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: pose_pics_ci
      DB_USER: root
      DB_PASSWORD: ci-disposable-password
      JWT_SECRET: ci-only-disposable-jwt-secret-not-for-production
      STUDIO_TIME_ZONE: Asia/Manila
      PORT: 5000
      SMOKE_API_URL: http://127.0.0.1:5000
      SMOKE_FRONTEND_URL: http://127.0.0.1:5000
      CI_BROWSER_BASE: http://127.0.0.1:5000
      CI_BROWSER_PASSWORD: disposable-ci-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run test:backend
      - run: npm run build
      - name: Initialize and seed disposable database twice
        run: |
          npm run db:init --workspace=backend
          node backend/tests/ci-fixtures.js
          npm run db:seed --workspace=backend
          npm run db:init --workspace=backend
      - name: Start production server and verify API and SPA routes
        run: |
          NODE_ENV=production node backend/src/server.js > "$RUNNER_TEMP/pose-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health; then break; fi
            sleep 2
          done
          npm run smoke:live
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
      - name: Check desktop and phone layouts and logins
        run: python scripts/browser-smoke.py
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            ${{ runner.temp }}/pose-server.log
            browser-smoke-output/
          if-no-files-found: ignore

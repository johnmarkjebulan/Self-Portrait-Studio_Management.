name: Deploy Pose and Pics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pose-pics-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.POSE_SITE_URL }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test:backend
      - run: npm run build
      - name: Trigger Render deployment of tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo 'Set the RENDER_DEPLOY_HOOK_URL repository secret first.' >&2
            exit 1
          fi
          curl --silent --fail --max-time 60 --get --data-urlencode "ref=$GITHUB_SHA" "$RENDER_DEPLOY_HOOK_URL" --output /dev/null
          echo 'Render accepted the deployment request.'
      - name: Verify deployed version
        env:
          SITE_URL: ${{ vars.POSE_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo 'Set POSE_SITE_URL as a repository variable to verify the deployed website.' >&2
            exit 1
          fi
          for i in $(seq 1 90); do
            health=$(curl --silent --fail --max-time 8 "${SITE_URL%/}/health" || true)
            if printf '%s' "$health" | jq -e --arg commit "$GITHUB_SHA" '.status == "ok" and .commit == $commit' >/dev/null 2>&1; then
              if curl --silent --fail --max-time 15 "${SITE_URL%/}/" --output /dev/null; then
                printf '### Deployment verified\n[Open Pose & Pics](%s)\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'New commit was not verified. Check Render deploy logs.' >&2
          exit 1
